{% extends 'base.html' %}

{% block header %}
Updating Kenshi Animals
{% endblock %}

{% block content %}

<h2>Enter a new value here</h2>
<form action="">
  <input type="hidden" name="id" value="{{id}}">
  Animal Name: <input type="text" name="name" value="{{existingName}}"><br />
  Organic/Robot: <input type="text" name="organicORrobot" value="{{existingOrgRob}}" /><br />
  Base Melee: <input type="text" name="baseMelee" value="{{existingMelee}}"><br />
  Base Defense: <input type="text" name="baseDefense" value="{{existingDef}}" /><br />
  Faction ID: <input type="text" name="factionID" value="{{existingFacID}}"><br />
  
  <input type="submit" value="SUBMIT">
</form>
<a href="/">Return to list</a>
{% endblock %}
